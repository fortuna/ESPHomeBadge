packages:
  # Order matters: packages are added to the pages list in declaration order.
  badge: !include ./apps/page_badge.yaml
  air: !include ./apps/page_air.yaml
  qr: !include ./apps/page_qr.yaml
  ir_blast: !include ./apps/page_ir_blast.yaml
  wifi: !include ./apps/page_wifi.yaml

font:
  - file: "./MaterialSymbolsRounded.ttf"
    id: icons_40
    size: 40
    glyphs:
      - "\U0000ea67"  # badge
      - "\U0000e29c"  # airwave
      - "\U0000e00a"  # qr_code_2
      - "\U0000f747"  # laser-pointer
      - "\U0000e63e"  # wifi

lvgl:
  - id: badge_lvgl
    log_level: DEBUG
    displays: [badge_display]
    # Need to reduce due to lack of PSRAM, as per https://esphome.io/components/lvgl/.
    buffer_size: 25%

    keypads:
      - id: lvgl_keypad
        long_press_repeat_time: 65535ms
        # esc: button_1
        prev: button_2
        next: button_3
        enter: button_4

    style_definitions:
      - id: container
        radius: 0
        pad_all: 0
        border_width: 0
        bg_opa: 0%

      - id: debug_border
        border_width: 1
        border_color: 0xFFFF00

      - id: page
        width: 100%
        height: 100%

      - id: surface
        bg_color: 0xFFFFFF
        bg_opa: 100%

      - id: switcher_entry
        radius: 0
        pad_all: 0
        border_width: 0
        bg_opa: 0%
        text_color: 0xFFFFFF
        width: SIZE_CONTENT
        height: SIZE_CONTENT

      - id: switcher_button
        width: SIZE_CONTENT
        height: SIZE_CONTENT
        bg_opa: 0%
        shadow_width: 0
        shadow_opa: 0%
        text_font: icons_40
        pad_all: 6
        radius: 8

      - id: switcher_focused
        bg_opa: 70%
        bg_color: 0x000000
        outline_width: 0
        outline_opa: 0%
        outline_pad: 0

    # Style for the root screen.
    height: 100%
    width: 100%

    top_layer:
      widgets:
        - !include ./page_selector.yaml

    pages:

binary_sensor:
  - id: !extend button_1
    on_press:
      - script.execute: show_selector
    on_release:
      - script.execute: dismiss_selector

  - id: !extend button_4
    on_press:
      - if:
          condition:
            lambda: return !lv_obj_has_flag(id(page_selector), LV_OBJ_FLAG_HIDDEN);
          then:
            - script.execute: dismiss_selector

script:
  - id: show_selector
    then:
      - lambda: |-
          lv_obj_clear_flag(id(page_selector), LV_OBJ_FLAG_HIDDEN);
          lv_group_t* selector_group = (lv_group_t*) lv_obj_get_user_data(id(page_selector));

          // Focus the selector button corresponding to the current page.
          // The selector structure is: page_selector > entry[N] > button[0].
          int current_page = id(badge_lvgl).get_current_page();
          lv_obj_t* entry = lv_obj_get_child(id(page_selector), current_page);
          lv_group_focus_obj(lv_obj_get_child(entry, 0));

          // Make keypad feed into the selector group.
          lv_indev_t* indev = find_indev_by_driver(id(lvgl_keypad).get_drv());
          lv_indev_set_group(indev, selector_group);

  - id: dismiss_selector
    then:
      - lambda: |-
          lv_group_t* selector_group = (lv_group_t*) lv_obj_get_user_data(id(page_selector));
          lv_obj_t* focused = lv_group_get_focused(selector_group);
          int page_index = focused ? (int)(intptr_t) lv_obj_get_user_data(focused) : 0;

          // Look up the target page's group before show_page, since the animation
          // is async and lv_scr_act() would still return the old screen after the call.
          lv_group_t* page_group = get_page_group(page_index);

          lv_obj_add_flag(id(page_selector), LV_OBJ_FLAG_HIDDEN);
          lv_indev_t* indev = find_indev_by_driver(id(lvgl_keypad).get_drv());
          lv_indev_set_group(indev, page_group);
          if (page_group) lv_group_focus_next(page_group);
          id(badge_lvgl).show_page(page_index, LV_SCR_LOAD_ANIM_FADE_OUT, 50);
