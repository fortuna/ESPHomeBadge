# Run this firmware on the development machine for more convenient LVGL development.

packages:
  base: !include ./lvgl.yaml

esphome:
  name: sdl
  includes:
    - menu.h
  on_boot:
    then:
      # Set mock values
      - text.set:
          id: badge_title
          value: Title
      - text.set:
          id: badge_subtitle
          value: Subtitle
      - script.execute:
          id: badge_on_eco2_value
          x: 4321.0
      - script.execute:
          id: badge_on_tvoc_value
          x: 123.0
      - text.set:
          id: qr_code_text
          value: 'https://example.com'
      # Set mock WiFi state
      - text_sensor.template.publish:
          id: wifi_ip_sensor
          state: '192.168.1.42'
      - text_sensor.template.publish:
          id: wifi_ssid_sensor
          state: 'MockNetwork'
      - script.execute: update_wifi_display

host:

logger:
  level: VERBOSE

display:
  - id: badge_display
    platform: sdl
    dimensions: {width: 320, height: 240}
    auto_clear_enabled: false
    update_interval: never

binary_sensor:
  - {id: button_1, platform: sdl, sdl_id: badge_display, key: SDLK_m}
  - {id: button_2, platform: sdl, sdl_id: badge_display, key: SDLK_COMMA}
  - {id: button_3, platform: sdl, sdl_id: badge_display, key: SDLK_PERIOD}
  - {id: button_4, platform: sdl, sdl_id: badge_display, key: SDLK_SLASH}
  - {id: key_up, platform: sdl, sdl_id: badge_display, key: SDLK_u}
  - {id: key_down, platform: sdl, sdl_id: badge_display, key: SDLK_d}
  - {id: key_left, platform: sdl, sdl_id: badge_display, key: SDLK_LEFTBRACKET}
  - {id: key_right, platform: sdl, sdl_id: badge_display, key: SDLK_RIGHTBRACKET}

text_sensor:
  - platform: template
    id: wifi_ip_sensor
    internal: true
    lambda: return {};
  - platform: template
    id: wifi_ssid_sensor
    internal: true
    lambda: return {};

globals:
  - id: wifi_is_enabled
    type: bool
    initial_value: 'true'
  - id: wifi_is_connected
    type: bool
    initial_value: 'true'

script:
  # Provide fake air sensor API.
  - id: badge_on_eco2_value
    parameters:
      x: float  # Value in ppm
    then: []
  - id: badge_on_tvoc_value
    parameters:
      x: float  # Value in ppb
    then: []
  # Sends the fake IR blast command.
  - id: on_ir_blast_click
    mode: single
    then:
      - logger.log:
          level: DEBUG
          format: "Fake IR blast command sent with address: 0xD880, command: 0xDD"
  # Mock WiFi toggle: flips connected state for demo purposes.
  - id: on_wifi_toggle
    mode: single
    then:
      - lambda: |-
          id(wifi_is_enabled) = !id(wifi_is_enabled);
          if (!id(wifi_is_enabled)) {
            id(wifi_is_connected) = false;
          } else {
            id(wifi_is_connected) = true;
          }
      - script.execute: update_wifi_display
