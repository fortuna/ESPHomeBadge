lvgl:
  - id: !extend badge_lvgl
    pages:
      - id: page_ir_blast
        on_boot:
          - lambda: |-
              lv_group_t* group = lv_group_create();
              ESP_LOGD("lvgl", "Initializing page_ir_blast: %p, group: %p", id(page_ir_blast).obj, group);
              lv_obj_set_user_data(id(page_ir_blast).obj, group);
              recursive_set_group(id(page_ir_blast).obj, group);
        styles: [page, surface]
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: CENTER
          flex_align_cross: CENTER
        widgets:
          - label:
              text: "\U0000f747"
              text_font: icons_40
              text_color: 0x2196F3
              text_align: CENTER
          - label:
              text: Send IR signal to nearby badges
              text_font: montserrat_16
              text_color: 0x757575
              text_align: CENTER
              width: 240
          - button:
              id: ir_blast_button
              width: 200
              height: 52
              bg_color: 0x2196F3
              widgets:
                - label:
                    text: SEND BLAST
                    text_font: montserrat_24
                    text_color: 0xFFFFFF
                    align: CENTER
                    text_align: CENTER
              on_click:
                - script.execute: on_ir_blast_click
                - lvgl.widget.show: ir_blast_status
                - delay: 1500ms
                - lvgl.widget.hide: ir_blast_status
          - label:
              id: ir_blast_status
              text: "IR Blast Sent!"
              text_color: 0x4CAF50
              text_font: montserrat_18
              hidden: true
