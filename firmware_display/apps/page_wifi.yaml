lvgl:
  - id: !extend badge_lvgl
    pages:
      - id: page_wifi
        on_boot:
          - lambda: |-
              lv_group_t* group = lv_group_create();
              ESP_LOGD("lvgl", "Initializing page_wifi: %p, group: %p", id(page_wifi).obj, group);
              lv_obj_set_user_data(id(page_wifi).obj, group);
              recursive_set_group(id(page_wifi).obj, group);
        styles: [page, surface]
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: CENTER
        pad_all: 16
        widgets:
          - label:
              text: WiFi
              text_font: montserrat_26
              text_color: 0x2196F3
              width: 100%
              pad_bottom: 8
          - obj:
              width: 100%
              height: SIZE_CONTENT
              bg_color: 0xF5F5F5
              bg_opa: 100%
              radius: 8
              border_width: 0
              pad_all: 12
              pad_bottom: 20
              layout:
                type: FLEX
                flex_flow: COLUMN
                flex_align_cross: START
              widgets:
                - label:
                    id: wifi_status_label
                    text: Connecting...
                    text_font: montserrat_22
                    text_color: 0xFF9800
                - label:
                    id: wifi_ssid_display_label
                    text: ""
                    text_font: montserrat_16
                    text_color: 0x757575
                - label:
                    id: wifi_ip_display_label
                    text: ""
                    text_font: montserrat_16
                    text_color: 0x757575
          - button:
              id: wifi_toggle_btn
              width: 200
              height: 48
              bg_color: 0xF44336
              on_click:
                - script.execute: on_wifi_toggle
              widgets:
                - label:
                    id: wifi_toggle_label
                    text: Disable WiFi
                    text_font: montserrat_20
                    text_color: 0xFFFFFF
                    align: CENTER
                    text_align: CENTER

script:
  - id: update_wifi_display
    then:
      - lambda: |-
          if (!id(wifi_is_enabled)) {
            lv_label_set_text(id(wifi_status_label), "WiFi Off");
            lv_obj_set_style_text_color(id(wifi_status_label), lv_color_hex(0x9E9E9E), LV_PART_MAIN);
            lv_label_set_text(id(wifi_toggle_label), "Enable WiFi");
            lv_obj_set_style_bg_color(id(wifi_toggle_btn), lv_color_hex(0x4CAF50), LV_PART_MAIN);
            lv_label_set_text(id(wifi_ssid_display_label), "");
            lv_label_set_text(id(wifi_ip_display_label), "");
          } else if (id(wifi_is_connected)) {
            lv_label_set_text(id(wifi_status_label), "Connected");
            lv_obj_set_style_text_color(id(wifi_status_label), lv_color_hex(0x4CAF50), LV_PART_MAIN);
            lv_label_set_text(id(wifi_toggle_label), "Disable WiFi");
            lv_obj_set_style_bg_color(id(wifi_toggle_btn), lv_color_hex(0xF44336), LV_PART_MAIN);
            std::string ssid = id(wifi_ssid_sensor).state;
            std::string ip = id(wifi_ip_sensor).state;
            if (!ssid.empty()) {
              lv_label_set_text(id(wifi_ssid_display_label), ("SSID: " + ssid).c_str());
            }
            if (!ip.empty()) {
              lv_label_set_text(id(wifi_ip_display_label), ("IP: " + ip).c_str());
            }
          } else {
            lv_label_set_text(id(wifi_status_label), "Connecting...");
            lv_obj_set_style_text_color(id(wifi_status_label), lv_color_hex(0xFF9800), LV_PART_MAIN);
            lv_label_set_text(id(wifi_toggle_label), "Disable WiFi");
            lv_obj_set_style_bg_color(id(wifi_toggle_btn), lv_color_hex(0xF44336), LV_PART_MAIN);
            lv_label_set_text(id(wifi_ssid_display_label), "");
            lv_label_set_text(id(wifi_ip_display_label), "");
          }
