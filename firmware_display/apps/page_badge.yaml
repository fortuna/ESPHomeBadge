lvgl:
  - id: !extend badge_lvgl
    pages:
      - id: page_badge
        styles: [page]
        bg_color: 0x1A237E
        bg_opa: 100%
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: CENTER
          flex_align_cross: CENTER
        text_align: CENTER
        widgets:
          - label:
              id: title_label
              text: !lambda return id(badge_title).state;
              text_font: montserrat_36
              text_color: 0xFFFFFF
              width: 100%
          - label:
              id: subtitle_label
              text: !lambda return id(badge_subtitle).state;
              text_font: montserrat_20
              text_color: 0xBBDEFB
              width: 100%

text:
  - id: badge_title
    name: Title
    initial_value: Badge Title
    platform: template
    icon: mdi:badge-account-horizontal-outline
    optimistic: true
    mode: text
    update_interval: never
    restore_value: true
    on_value:
      - lvgl.label.update:
          id: title_label
          text: !lambda return x;
      - if:
          condition: {lambda: return x.length() > 0;}
          then:
            - lvgl.widget.show: title_label
          else:
            - lvgl.widget.hide: title_label

  - id: badge_subtitle
    name: Subtitle
    initial_value: Enable Wi-Fi and configure via local network web server
    platform: template
    icon: mdi:badge-account-horizontal-outline
    optimistic: true
    mode: text
    update_interval: never
    restore_value: true
    on_value:
      - lvgl.label.update:
          id: subtitle_label
          text: !lambda return x;
      - if:
          condition: {lambda: return x.length() > 0;}
          then:
            - lvgl.widget.show: subtitle_label
          else:
            - lvgl.widget.hide: subtitle_label
