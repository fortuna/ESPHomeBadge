obj:
  id: page_selector
  on_boot:
    - lambda: |-
        lv_group_t* group = lv_group_create();
        lv_obj_set_user_data(id(page_selector), group);
        // Order must match the package include order in lvgl.yaml.
        register_page(group, id(page_badge).obj,    id(sel_btn_badge));
        register_page(group, id(page_air).obj,      id(sel_btn_air));
        register_page(group, id(page_qr).obj,       id(sel_btn_qr));
        register_page(group, id(page_ir_blast).obj, id(sel_btn_ir));
        register_page(group, id(page_wifi).obj,     id(sel_btn_wifi));
  styles: [container]
  height: SIZE_CONTENT
  width: SIZE_CONTENT
  align: CENTER
  layout:
    type: FLEX
    flex_flow: ROW
    flex_align_track: CENTER
    pad_column: 0
  hidden: true
  bg_color: 0x333333
  bg_opa: 80%
  pad_all: 6
  widgets:
    - obj:
        styles: [container, switcher_entry]
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: CENTER
        widgets:
          - button:
              id: sel_btn_badge
              scroll_on_focus: true
              styles: [switcher_button]
              focus_key:
                styles: [switcher_focused]
              widgets:
                - label:
                    text: "\U0000ea67"
          - label:
              text: Badge
    - obj:
        styles: [container, switcher_entry]
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: CENTER
        widgets:
          - button:
              id: sel_btn_air
              scroll_on_focus: true
              styles: [switcher_button]
              focus_key:
                styles: [switcher_focused]
              widgets:
                - label:
                    text: "\U0000e29c"
          - label:
              text: Air
    - obj:
        styles: [container, switcher_entry]
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: CENTER
        widgets:
          - button:
              id: sel_btn_qr
              scroll_on_focus: true
              styles: [switcher_button]
              focus_key:
                styles: [switcher_focused]
              widgets:
                - label:
                    text: "\U0000e00a"
          - label:
              text: QR
    - obj:
        styles: [container, switcher_entry]
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: CENTER
        widgets:
          - button:
              id: sel_btn_ir
              scroll_on_focus: true
              styles: [switcher_button]
              focus_key:
                styles: [switcher_focused]
              widgets:
                - label:
                    text: "\U0000f747"
          - label:
              text: IR
    - obj:
        styles: [container, switcher_entry]
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_cross: CENTER
        widgets:
          - button:
              id: sel_btn_wifi
              scroll_on_focus: true
              styles: [switcher_button]
              focus_key:
                styles: [switcher_focused]
              widgets:
                - label:
                    text: "\U0000e63e"
          - label:
              text: WiFi
